plugins {
    id("net.fabricmc.fabric-loom")
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/valhelsia_core.accesswidener")

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly(project(":common"))
    commonJava project(path: ":common", configuration: "commonJava")
    commonResources project(path: ":common", configuration: "commonResources")

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly "com.google.errorprone:error_prone_annotations:2.11.0"
}

tasks.named("compileJava", JavaCompile).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named("processResources", ProcessResources).configure {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)

    var replaceProperties = [
            version              : mod_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version
    ]
    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
}

tasks.named("sourcesJar", Jar).configure {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}
